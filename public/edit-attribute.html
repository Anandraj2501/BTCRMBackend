<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Attribute - CRM Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 20px; color: green; }
    </style>
</head>
<body>
    <h1>Edit Attribute</h1>
    <form id="editForm">
        <label for="entity">Entity Logical Name:</label>
        <input type="text" id="entity" required>

        <label for="attribute">Attribute Logical Name:</label>
        <input type="text" id="attribute" required>

        <label for="displayname">Display Name:</label>
        <input type="text" id="displayname">

        <label for="schemaname">Schema Name:</label>
        <input type="text" id="schemaname">

        <label for="attributetype">Attribute Type:</label>
        <select id="attributetype">
            <option value="String">String</option>
            <option value="Integer">Integer</option>
            <option value="Boolean">Boolean</option>
            <option value="DateTime">DateTime</option>
            <option value="Decimal">Decimal</option>
            <option value="Lookup">Lookup</option>
        </select>

        <label for="maxlength">Max Length:</label>
        <input type="number" id="maxlength">

        <label for="isnullable">
            <input type="checkbox" id="isnullable"> Is Nullable
        </label>

        <button type="submit">Update Attribute</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById('editForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const entity = document.getElementById('entity').value;
            const attribute = document.getElementById('attribute').value;
            const data = {
                displayname: document.getElementById('displayname').value,
                schemaname: document.getElementById('schemaname').value,
                attributetype: document.getElementById('attributetype').value,
                maxlength: document.getElementById('maxlength').value ? parseInt(document.getElementById('maxlength').value) : undefined,
                isnullable: document.getElementById('isnullable').checked
            };

            try {
                const response = await fetch(`/api/metadata/attribute/${entity}/${attribute}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    message.textContent = result.message;
                    message.style.color = 'green';
                } else {
                    message.textContent = result.message || 'Error updating attribute';
                    message.style.color = 'red';
                }
            } catch (error) {
                message.textContent = 'Network error';
                message.style.color = 'red';
            }
        });
    </script>
</body>
</html>
